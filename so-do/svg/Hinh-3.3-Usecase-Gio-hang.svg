@startuml
skinparam dpi 160
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 13
skinparam shadowing false
skinparam roundcorner 8
skinparam ArrowColor #7A5C43
skinparam ArrowFontSize 12
skinparam actorStyle awesome
skinparam actor {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam usecase {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  FontSize 13
}
skinparam rectangle {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam component {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam database {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam queue {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam cloud {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam participant {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam sequence {
  LifeLineBorderColor #A98867
  LifeLineBackgroundColor #F3E7D8
  ArrowColor #7A5C43
  DividerBackgroundColor #EFE2D0
  BoxBackgroundColor #FAF5EE
  BoxBorderColor #C9B197
  GroupBackgroundColor #EFE2D0
  GroupBorderColor #A98867
}
skinparam note {
  BorderColor #C9A227
  BackgroundColor #FFF9E8
}
skinparam class {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  HeaderBackgroundColor #E8D7C3
}
title Biểu đồ phân rã use case Giỏ hàng
left to right direction
actor Guest as G
actor "Member" as M

rectangle "Quản lý giỏ hàng" {
  usecase "Xem giỏ hàng" as U1
  usecase "Thêm phiên bản\nvào giỏ" as U2
  usecase "Cập nhật số lượng" as U3
  usecase "Xóa một dòng hàng" as U4
  usecase "Xóa toàn bộ giỏ" as U5
  usecase "Kiểm tra tồn kho" as U6
  usecase "Tính giá hiệu lực\n(khuyến mãi, chiến dịch)" as U7
}

G - -> U1
G - -> U2
G - -> U3
G - -> U4
G - -> U5
M - -> U1
M - -> U2
M - -> U3
M - -> U4
M - -> U5

U2 ..> U6 : <<include>>
U3 ..> U6 : <<include>>
U1 ..> U7 : <<include>>
@enduml

