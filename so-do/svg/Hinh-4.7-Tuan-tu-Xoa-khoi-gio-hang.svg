@startuml
skinparam dpi 160
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 13
skinparam shadowing false
skinparam roundcorner 8
skinparam ArrowColor #7A5C43
skinparam ArrowFontSize 12
skinparam actorStyle awesome
skinparam actor {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam usecase {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  FontSize 13
}
skinparam rectangle {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam component {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam database {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam queue {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam cloud {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam participant {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam sequence {
  LifeLineBorderColor #A98867
  LifeLineBackgroundColor #F3E7D8
  ArrowColor #7A5C43
  DividerBackgroundColor #EFE2D0
  BoxBackgroundColor #FAF5EE
  BoxBorderColor #C9B197
  GroupBackgroundColor #EFE2D0
  GroupBorderColor #A98867
}
skinparam note {
  BorderColor #C9A227
  BackgroundColor #FFF9E8
}
skinparam class {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  HeaderBackgroundColor #E8D7C3
}
autonumber

title Biểu đồ tuần tự chức năng Xóa sản phẩm khỏi giỏ hàng

actor "Người dùng" as U
participant "Giao diện" as FE
participant "CartController" as C
participant "CartService" as S
database "PostgreSQL" as DB

U -> FE : Nhấn biểu tượng xóa trên dòng hàng
FE -> C : DELETE /api/cart/items/:itemId
C -> S : removeItem(owner, itemId)
S -> DB : SELECT cart_items JOIN carts
DB - -> S : Dòng hàng
alt Dòng không thuộc giỏ của người dùng
  S - -> C : AppError 404
  C - -> FE : Không tìm thấy dòng hàng
else Hợp lệ
  S -> DB : DELETE FROM cart_items WHERE id = ?
  S -> DB : SELECT lại giỏ hàng
  S -> S : Tính lại tổng tiền tạm tính
  S - -> C : Giỏ hàng đã cập nhật
  C - -> FE : sendSuccess(200)
  FE - -> U : Cập nhật danh sách và tổng tiền
end
@enduml

