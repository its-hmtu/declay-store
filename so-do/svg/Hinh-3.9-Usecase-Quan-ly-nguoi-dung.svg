@startuml
skinparam dpi 160
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 13
skinparam shadowing false
skinparam roundcorner 8
skinparam ArrowColor #7A5C43
skinparam ArrowFontSize 12
skinparam actorStyle awesome
skinparam actor {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam usecase {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  FontSize 13
}
skinparam rectangle {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam component {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam database {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam queue {
  BorderColor #7A5C43
  BackgroundColor #F3E7D8
}
skinparam cloud {
  BorderColor #A98867
  BackgroundColor #FFFDF9
}
skinparam participant {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
}
skinparam sequence {
  LifeLineBorderColor #A98867
  LifeLineBackgroundColor #F3E7D8
  ArrowColor #7A5C43
  DividerBackgroundColor #EFE2D0
  BoxBackgroundColor #FAF5EE
  BoxBorderColor #C9B197
  GroupBackgroundColor #EFE2D0
  GroupBorderColor #A98867
}
skinparam note {
  BorderColor #C9A227
  BackgroundColor #FFF9E8
}
skinparam class {
  BorderColor #7A5C43
  BackgroundColor #FBF3E7
  HeaderBackgroundColor #E8D7C3
}
title Biểu đồ phân rã use case Quản lý người dùng
left to right direction
actor "Super Admin" as SA

rectangle "Quản lý tài khoản quản trị" {
  usecase "Xem danh sách\ntài khoản quản trị" as U1
  usecase "Tạo tài khoản mới" as U2
  usecase "Phân vai trò\n(super_admin / admin / editor)" as U3
  usecase "Chỉnh sửa\nthông tin tài khoản" as U4
  usecase "Khóa / mở khóa\ntài khoản" as U5
  usecase "Xóa tài khoản" as U6
  usecase "Thu hồi phiên\nđăng nhập" as U7
}

SA - -> U1
SA - -> U2
SA - -> U4
SA - -> U5
SA - -> U6

U2 ..> U3 : <<include>>
U4 ..> U3 : <<extend>>
U5 ..> U7 : <<include>>
@enduml

